name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/swipe-cart-repo-move-bzzn9n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build date
        run: sed -i "s/__BUILD_DATE__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" src/version.js
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html app.css manifest.webmanifest sw.js _site/
          cp -R src _site/src
          cp -R icons _site/icons
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
