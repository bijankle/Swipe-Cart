name: eBay catalog refresh

on:
  workflow_dispatch:
    inputs:
      debug_one:
        description: "One query, two items, dump raw JSON (no catalog write)"
        required: false
        default: "false"
      per_query:
        description: "Listings to keep per query"
        required: false
        default: "8"
  schedule:
    # Weekly — the Browse API allows 5k calls/day, so this is nowhere near limits.
    - cron: "0 5 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: ebay-catalog
  cancel-in-progress: false

jobs:
  ebay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch eBay listings
        run: node tools/ebay-catalog.mjs
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          DEBUG_ONE: ${{ inputs.debug_one }}
          PER_QUERY: ${{ inputs.per_query }}
      - name: Commit updated catalog
        id: commit
        run: |
          git add catalog.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog unchanged."
          else
            git config user.name "catalog-refresh[bot]"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Refresh product catalog (eBay)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
