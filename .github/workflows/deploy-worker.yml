name: Deploy API worker

on:
  workflow_dispatch:
  push:
    branches: [claude/swipe-cart-repo-move-bzzn9n]
    paths: ["worker/**"]

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            EBAY_APP_ID
            EBAY_CERT_ID
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
      - name: Smoke test
        run: |
          sleep 5
          body=$(curl -sf "https://swipe-cart-api.bijank-2015.workers.dev/search?q=ceramic+lamp&limit=2")
          echo "$body" | head -c 600
          echo "$body" | grep -q '"itemSummaries"' && echo "SMOKE OK" || (echo "SMOKE FAILED" && exit 1)
