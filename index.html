<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5865f2" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Swipe Shop — teach it your taste</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='22' fill='%235865F2'/%3E%3Ctext x='32' y='46' font-family='sans-serif' font-size='36' fill='%23fff' text-anchor='middle'%3E%E2%99%A5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./app.css?v=0.8.0" />
  <script type="module" src="./src/app.js?v=0.8.0"></script>
  <script>
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>
</head>
<body>
  <main class="shop">
    <header class="shop-header">
      <div class="shop-logo">♥</div>
      <div class="shop-titles">
        <span class="shop-name">Swipe Shop</span>
      </div>
      <div class="strength" title="How well the algorithm knows you">
        <span class="strength-label" id="strength-label">Untrained</span>
        <span class="strength-meter"><span class="strength-fill" id="strength-fill"></span></span>
      </div>
      <button type="button" class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab is-active" id="tab-deck" role="tab" aria-selected="true">Discover</button>
      <button type="button" class="tab" id="tab-profile" role="tab" aria-selected="false">
        My profile <span class="tab-badge" id="shortlist-count" hidden></span>
      </button>
    </nav>

    <div id="filter-bar" class="filter-bar" hidden>
      <span class="filter-bar-text">Showing only <b id="filter-label"></b></span>
      <button type="button" id="filter-clear" class="filter-clear">✕ Clear</button>
    </div>

    <!-- ================== Discover (deck) view ================== -->
    <section id="view-deck" class="view">
      <div class="stack-wrap">
        <div id="stack" class="stack" aria-live="polite"></div>

        <div id="deck-empty" class="deck-empty" hidden>
          <div class="deck-empty-emoji">🎉</div>
          <h2 id="deck-empty-title">You’ve swiped the whole catalog</h2>
          <p id="deck-empty-text"></p>
          <div class="deck-empty-actions">
            <button type="button" class="btn btn-primary" id="empty-clear-filter" hidden>Back to everything</button>
            <button type="button" class="btn btn-primary" id="empty-to-profile">See my profile</button>
            <button type="button" class="btn btn-ghost" id="empty-reset">Start over</button>
          </div>
        </div>
      </div>

      <div class="actions" id="actions">
        <button type="button" class="act act-undo" id="act-undo" title="Undo last swipe (U)" aria-label="Undo">↶</button>
        <button type="button" class="act act-nope" id="act-nope" title="Not for me (←)" aria-label="Nope">✕</button>
        <button type="button" class="act act-love" id="act-love" title="Need it! (↑)" aria-label="Love">★</button>
        <button type="button" class="act act-like" id="act-like" title="I like it (→)" aria-label="Like">♥</button>
        <a class="act act-open" id="act-open" title="Open on the store’s site (O)" aria-label="Open on store site"
           href="#" target="_blank" rel="noopener noreferrer">↗</a>
      </div>

      <p class="deck-progress" id="deck-progress"></p>
    </section>

    <!-- ================== Profile view ================== -->
    <section id="view-profile" class="view" hidden>
      <div id="profile-body"></div>
    </section>

    <!-- ================== Settings view ================== -->
    <section id="view-settings" class="view" hidden>
      <div class="panel">
        <h2>About</h2>
        <p class="panel-sub">Swipe Shop — a local shopping taste profiler. Everything runs on this device.</p>
        <div class="about-row"><span>Version</span><b id="about-version"></b></div>
        <div class="about-row"><span>Last updated</span><b id="about-updated"></b></div>
        <div class="about-row"><span>Source</span>
          <a href="https://github.com/bijankle/Swipe-Cart" target="_blank" rel="noopener noreferrer">github.com/bijankle/Swipe-Cart</a></div>
      </div>
      <div class="panel">
        <h2>Your data</h2>
        <p class="panel-sub">Your swipes and taste profile live only on this device.</p>
        <button type="button" class="btn btn-danger" id="settings-reset">Erase my profile</button>
      </div>
    </section>

    <!-- Item detail sheet — opened by tapping the middle of a card's photo -->
    <div id="detail-backdrop" class="detail-backdrop" hidden>
      <article class="detail-sheet" role="dialog" aria-modal="true" aria-label="Item details">
        <button type="button" class="icon-btn detail-close" id="detail-close" aria-label="Close">✕</button>
        <div id="detail-body"></div>
      </article>
    </div>

    <div id="toast" class="toast" hidden></div>
  </main>
</body>
</html>
